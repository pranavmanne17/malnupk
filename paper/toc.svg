<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<style>
.hdr{font-size:34px;font-weight:700;fill:#13202b}
.sub{font-size:19px;fill:#5a6b78}
.lbl{font-size:20px;font-weight:700;fill:#13202b}
.sm{font-size:16px;fill:#56656f}
.tiny{font-size:14px;fill:#6b7880}
.num{font-size:30px;font-weight:700;fill:#13202b}
.box{fill:#fff;stroke:#b4c0c9;stroke-width:1.8;rx:10}
.hi{fill:#e9f3fa;stroke:#2d6d9e;stroke-width:2.4}
.warn{fill:#fdefe9;stroke:#c8643a;stroke-width:2}
.good{fill:#eaf6f1;stroke:#2f8e68;stroke-width:2}
.ar{stroke:#9aa7b1;stroke-width:2.4;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
<path d="M0,0 L0,7 L9,3.5 z" fill="#9aa7b1"/></marker></defs>
<rect width="1600" height="760" fill="#fff"/>

<text x="48" y="56" class="hdr">Milligrams per kilogram assumes every kilogram is the same</text>
<text x="48" y="90" class="sub">In undernutrition it is not — and the error runs in opposite directions for different drugs</text>

<!-- LEFT: the problem -->
<rect class="box warn" x="48" y="130" width="380" height="250"/>
<text x="238" y="168" class="lbl" text-anchor="middle">Same label dose, different exposure</text>
<text x="238" y="200" class="sm" text-anchor="middle">severe acute malnutrition + contaminated water</text>
<text x="88"  y="248" class="sm">rifampicin</text>
<text x="400" y="248" class="num" text-anchor="end" fill="#c8643a">↓ 4×</text>
<text x="88"  y="296" class="sm">lumefantrine</text>
<text x="400" y="296" class="num" text-anchor="end" fill="#c8643a">↓↓</text>
<text x="88"  y="344" class="sm">gentamicin (oedema)</text>
<text x="400" y="344" class="num" text-anchor="end" fill="#2d6d9e">↑</text>

<path class="ar" d="M434,255 L498,255"/>

<!-- MIDDLE: the method -->
<rect class="box" x="504" y="124" width="470" height="80"/>
<text x="739" y="152" class="lbl" text-anchor="middle">Bedside-observable covariates only</text>
<text x="739" y="176" class="tiny" text-anchor="middle">anthropometry · a lab panel that may be missing</text>
<text x="739" y="194" class="tiny" text-anchor="middle">drinking-water chemistry · drug descriptors</text>
<path class="ar" d="M739,204 L739,218"/>

<rect class="box" x="504" y="220" width="470" height="54"/>
<text x="739" y="252" class="lbl" text-anchor="middle">Neural encoder (drug-gated)</text>
<path class="ar" d="M739,274 L739,302"/>

<rect class="box hi" x="504" y="304" width="470" height="62"/>
<text x="739" y="332" class="lbl" text-anchor="middle">Seven physiological parameters</text>
<text x="739" y="356" class="tiny" text-anchor="middle">CL · V1 · Q · V2 · ka · F · fu — allometry fixed, dose excluded</text>
<path class="ar" d="M739,366 L739,394"/>

<rect class="box" x="504" y="396" width="470" height="54"/>
<text x="739" y="428" class="lbl" text-anchor="middle">Differentiable compartmental solver</text>
<path class="ar" d="M739,450 L739,478"/>

<rect class="box" x="504" y="480" width="470" height="54"/>
<text x="739" y="512" class="lbl" text-anchor="middle">Concentration–time curve → dose decision</text>

<path class="ar" d="M980,330 L1044,330"/>

<!-- RIGHT: results -->
<rect class="box good" x="1050" y="130" width="502" height="190"/>
<text x="1301" y="170" class="lbl" text-anchor="middle">Recovers the mechanism</text>
<text x="1301" y="212" class="num" text-anchor="middle">1.05× median fold error</text>
<text x="1301" y="244" class="sm" text-anchor="middle">98.6% within twofold · latent parameters R² 0.98–0.999</text>
<text x="1301" y="286" class="sm" text-anchor="middle">solver 1.54× · auxiliary supervision 3.72×</text>

<rect class="box good" x="1050" y="336" width="502" height="190"/>
<text x="1301" y="376" class="lbl" text-anchor="middle">Model-guided vs the weight band</text>
<text x="1301" y="420" class="num" text-anchor="middle">69% → 88% on target</text>
<text x="1301" y="454" class="num" text-anchor="middle">12.5% → 0% over-exposed</text>
<text x="1301" y="490" class="sm" text-anchor="middle">median dose unchanged at 1.00×; only failing patients move</text>

<rect class="box" x="1050" y="542" width="502" height="96" style="fill:#f7f8f9;stroke:#c9d2d8"/>
<text x="1301" y="574" class="lbl" text-anchor="middle" fill="#8a4b2d">…and where it fails</text>
<text x="1301" y="602" class="sm" text-anchor="middle">no transfer to an unseen drug (fold error 11.2)</text>
<text x="1301" y="626" class="sm" text-anchor="middle">dropout 90% interval covers 45% of the truth</text>

<!-- bottom banner -->
<rect x="48" y="664" width="1504" height="56" rx="8" fill="#13202b"/>
<text x="800" y="700" font-size="21px" font-weight="700" fill="#fff" text-anchor="middle">All data are synthetic. This is a recovery experiment on a known generative process, not evidence about any patient.</text>
</svg>
