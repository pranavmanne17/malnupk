[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malnupk"
version = "0.1.0"
description = "Pharmacology-informed deep learning for drug disposition in undernourished, toxicant-exposed patients. Research simulator; not a clinical tool."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "torch>=2.0",
    "matplotlib>=3.7", "pandas>=2.0", "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
malnupk = "malnupk.cli:main"

[tool.setuptools.packages.find]
include = ["malnupk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
